<style>
  :root {
    --bg-dark: #0a0a0a;
    --bg-card: #1a1a1a;
    --text-main: #e0e0e0;
    --text-muted: #888888;
    --border: #333333;
    --accent: #c0c0c0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Добавил фоновый градиент как страховку */
    background-image: linear-gradient(to bottom, #050505 0%, #1a1a1a 100%);
  }

  /* Фон: Бездна */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    /* Ссылка на картинку Unsplash */
    background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2000&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    /* Затемнение картинки, чтобы текст читался */
    background-color: rgba(0, 0, 0, 0.6); 
    z-index: -1;
    opacity: 0.9;
  }

  .top-nav {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    background-color: transparent; /* Прозрачный поверх фона */
    width: 100%;
    box-sizing: border-box;
    position: relative;
    z-index: 10;
    backdrop-filter: blur(5px); /* Лёгкое размытие фона под меню */
  }

  .nav-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.3s, text-shadow 0.3s;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--accent);
    text-shadow: 0 0 8px rgba(192, 192, 192, 0.4);
  }

  .error-container {
    background: rgba(10, 10, 10, 0.95); /* Почти непрозрачный фон */
    backdrop-filter: blur(10px);
    padding: 40px 30px;
    border-radius: 12px;
    text-align: center;
    max-width: 600px;
    width: 90%;
    border: 1px solid var(--border);
    z-index: 5;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h1.error-code {
    font-size: 6rem;
    line-height: 1;
    color: var(--accent);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 400;
  }

  p.error-message {
    color: var(--text-muted);
    font-size: 1.1rem;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }

  .btn {
    padding: 14px 28px;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
    text-transform: uppercase;
    transition: all 0.3s;
    font-size: 0.9rem;
  }

  .btn-primary {
    background-color: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-primary:hover {
    background-color: var(--accent);
    color: #000;
  }

  .btn-secondary {
    background-color: var(--bg-card);
    color: white;
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background-color: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  @media (max-width: 768px) {
    .top-nav { gap: 16px; flex-wrap: wrap; }
    h1.error-code { font-size: 4rem; }
    .error-container { padding: 25px 20px; }
  }
</style>
