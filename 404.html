<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Бездна</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --border: #333333;
      --accent: #c0c0c0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* ГЛАВНОЕ ИСПРАВЛЕНИЕ: убираем центрирование из body, 
         чтобы меню не уехало в центр экрана */
    }

    /* Фон: Бездна */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('abyss.png');
      background-size: cover;
      background-position: center;
      background-color: rgba(0, 0, 0, 0.6); 
      z-index: -1;
      opacity: 0.9;
    }

    /* Меню (всегда сверху) */
    .top-nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
      background-color: transparent;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(192, 192, 192, 0.4);
    }

    /* Контейнер для центрирования карточки ошибки */
    .main-wrapper {
      flex-grow: 1; /* Растягивает блок, прижимая футер вниз (если будет) */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .error-container {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      border: 1px solid var(--border);
      z-index: 5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    h1.error-code {
      font-size: 6rem;
      line-height: 1;
      color: var(--accent);
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: 400;
    }

    p.error-message {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .btn-primary {
      background-color: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent);
      color: #000;
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: white;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      .top-nav { gap: 16px; flex-wrap: wrap; }
      h1.error-code { font-size: 4rem; }
      .error-container { padding: 25px 20px; }
    }
  </style>
</head>
<body>

  <!-- Меню всегда сверху -->
  <nav class="top-nav">
    <a href="index.html" class="nav-link">Главная</a>
    <a href="suggest.html" class="nav-link">Предложить идею</a>
  </nav>

  <!-- Центрирование карточки ошибки -->
  <main class="main-wrapper">
    <div class="error-container">
      <h1 class="error-code">404</h1>
      <p class="error-message">Кажется, ты упал в бездну...<br>Но мы можем вернуть тебя обратно.</p>
      
      <div class="actions">
        <a href="index.html" class="btn btn-primary">На главную</a>
        <a href="javascript:history.back()" class="btn btn-secondary">Назад</a>
      </div>
    </div>
  </main>

</body>
</html>
